<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-row topbar-row1">
      <a class="brand" href="./index.html" aria-label="Inicio">
        <img class="brand-logo" src="./assets/img/logo.png" alt="Santelmo Computación" />
      </a>
    </div>
    <div class="topbar-row topbar-row2">
      <nav class="nav" aria-label="Navegación">
        <a href="./index.html">Inicio</a>

        <a href="./novedades.html">Novedades</a>
        <a href="./guias-tech.html">Guias Tech</a>

      </nav>
      <div class="rate-pill" aria-label="Tipo de cambio"><div class="value" data-rate-value>USDT/ARS: —</div>
    </div></div>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Catálogo</h1>

    <div class="controls" role="region" aria-label="Filtros">
      <div class="field">
        <label for="q">Buscar</label>
        <input id="q" type="search" placeholder="Nombre o descripción…" data-filter-q />
      </div>
      <div class="field">
        <label for="cat">Categoría</label>
        <select id="cat" data-filter-category></select>
      </div>
      <div class="field">
        <label for="sort">Orden</label>
        <select id="sort" data-filter-sort>
          <option value="relevancia">Relevancia</option>
          <option value="precio_asc">Precio (menor a mayor)</option>
          <option value="precio_desc">Precio (mayor a menor)</option>
          <option value="stock">Stock</option>
        </select>
      </div>
    </div>

    <div class="grid" data-catalog-grid></div>

    <footer class="footer">
      Los precios en ARS se calculan con USDT/ARS. Si Binance no responde, verás solo USD.
    </footer>
  </main>

  <a class="fab" href="javascript:void(0)" role="button" aria-label="WhatsApp" data-fab-whatsapp>

    <span class="txt">
      <span class="t">WhatsApp</span>
      <span class="s">Comprar / consultar</span>

<button id="scrollTopBtn" class="scroll-top-btn">↑ Inicio</button>
<script>
document.addEventListener("scroll", function(){
  const btn = document.getElementById("scrollTopBtn");
  if(window.scrollY > 200){
    btn.style.display = "block";
  } else {
    btn.style.display = "none";
  }
});
document.getElementById("scrollTopBtn").addEventListener("click", function(){
  window.scrollTo({ top: 0, behavior: "smooth" });
});
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const whatsappBtn = document.querySelector("[data-fab-whatsapp]");
  if (whatsappBtn) {
    whatsappBtn.addEventListener("click", function () {
      if (typeof fbq !== "undefined") {
        fbq('track', 'Lead');
        console.log("Evento Lead enviado a Meta");
      }
    });
  }
});
</script>
